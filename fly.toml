# fly.toml app configuration file generated for lasernoises-resume on 2026-03-13T11:13:15+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lasernoises-resume'
primary_region = 'fra'

[build]

[env]
  RESUME_BASE_URL = 'https://resume.lasernoises.com'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
